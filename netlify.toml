[build]
command = "npx next build"
publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,.vercel-test,**/*.md,**/*.sql,package-lock.json,.claude/**,.gitignore,**/debug-*.js,**/setup-*.js"
  SECRETS_SCAN_OMIT_KEYS = "VIPPS_ENV,NEXT_PUBLIC_APP_URL,EMAIL_FROM,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILGUN_WEBHOOK_SIGNING_KEY"

[[plugins]]
package = "@netlify/plugin-nextjs"

# The BNI method document is internal (consultants only) and is served behind
# the trainer-portal login at /bnimsp/strategi. Old addresses forward there.
# Fonts and icons under /bnistrategi/ stay public files (not confidential).
[[redirects]]
  from = "https://bnistrategi.tinglum.com/*"
  to = "https://msp.tinglum.com/bnimsp/strategi"
  status = 301
  force = true

[[redirects]]
  from = "/quest"
  to = "https://quest.mynutritiontest.com/"
  status = 301
  force = true

[[redirects]]
  from = "/quest/*"
  to = "https://quest.mynutritiontest.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/bnimsp"
  to = "https://msp.tinglum.com/bnimsp"
  status = 301
  force = true

[[redirects]]
  from = "/bnimsp/*"
  to = "https://msp.tinglum.com/bnimsp/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/bnistrategi"
  to = "https://msp.tinglum.com/bnimsp/strategi"
  status = 301
  force = true

[[redirects]]
  from = "/bnistrategi/"
  to = "https://msp.tinglum.com/bnimsp/strategi"
  status = 301
  force = true

[[redirects]]
  from = "/bnistrategi/index.html"
  to = "https://msp.tinglum.com/bnimsp/strategi"
  status = 301
  force = true
