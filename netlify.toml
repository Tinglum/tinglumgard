[build]
command = "npx next build"
publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,.vercel-test,**/*.md,**/*.sql,package-lock.json,.claude/**,.gitignore,**/debug-*.js,**/setup-*.js"
  SECRETS_SCAN_OMIT_KEYS = "VIPPS_ENV,NEXT_PUBLIC_APP_URL,EMAIL_FROM,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILGUN_WEBHOOK_SIGNING_KEY"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Dedicated subdomain for the BNI strategy & communication page.
# bnistrategi.tinglum.com serves the standalone document on every path.
# Requires the domain alias + DNS (CNAME bnistrategi -> the Netlify site).
[[redirects]]
  from = "https://bnistrategi.tinglum.com/*"
  to = "/bnistrategi/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/quest"
  to = "https://quest.mynutritiontest.com/"
  status = 301
  force = true

[[redirects]]
  from = "/quest/*"
  to = "https://quest.mynutritiontest.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/bnimsp"
  to = "https://msp.tinglum.com/bnimsp"
  status = 301
  force = true

[[redirects]]
  from = "/bnimsp/*"
  to = "https://msp.tinglum.com/bnimsp/:splat"
  status = 301
  force = true

# Also reachable at a clean /bnistrategi path on the primary domain.
[[redirects]]
  from = "/bnistrategi"
  to = "/bnistrategi/index.html"
  status = 200
