[build]
command = "npx next build"
publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,.vercel-test,**/*.md,**/*.sql,package-lock.json,.claude/**,.gitignore,**/debug-*.js,**/setup-*.js"
  SECRETS_SCAN_OMIT_KEYS = "VIPPS_ENV,NEXT_PUBLIC_APP_URL,EMAIL_FROM,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILGUN_WEBHOOK_SIGNING_KEY"

[[plugins]]
package = "@netlify/plugin-nextjs"

# The goat lineage app (Tinglum/goat-lineage-app, its own Netlify site) is
# served at /goat. That app is built with basePath "/goat", so paths pass
# through unchanged.
[[redirects]]
  from = "/goat"
  to = "https://goat-lineage-app.netlify.app/goat"
  status = 200
  force = true

[[redirects]]
  from = "/goat/*"
  to = "https://goat-lineage-app.netlify.app/goat/:splat"
  status = 200
  force = true

# BNI documents now live on msp.tinglum.com (repo bni-msp-training). The
# method document is internal (behind the portal login); the training
# documents are open. Old addresses forward there.
[[redirects]]
  from = "https://bnistrategi.tinglum.com/*"
  to = "https://msp.tinglum.com/bnimsp/strategi"
  status = 301
  force = true

[[redirects]]
  from = "/quest"
  to = "https://quest.mynutritiontest.com/"
  status = 301
  force = true

[[redirects]]
  from = "/quest/*"
  to = "https://quest.mynutritiontest.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/bnimsp"
  to = "https://msp.tinglum.com/bnimsp"
  status = 301
  force = true

[[redirects]]
  from = "/bnimsp/*"
  to = "https://msp.tinglum.com/bnimsp/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/bnistrategi"
  to = "https://msp.tinglum.com/bnimsp/strategi"
  status = 301
  force = true

[[redirects]]
  from = "/bnistrategi/*"
  to = "https://msp.tinglum.com/bnimsp/strategi"
  status = 301
  force = true

[[redirects]]
  from = "/bnitrening/*"
  to = "https://msp.tinglum.com/bnitrening/:splat"
  status = 301
  force = true
