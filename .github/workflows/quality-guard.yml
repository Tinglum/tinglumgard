name: Quality Guard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  encoding-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Encoding guard
        run: npm run check:encoding

      - name: Post-order flow regression
        run: npm run check:email-flows

      - name: Typecheck
        run: npm run typecheck
