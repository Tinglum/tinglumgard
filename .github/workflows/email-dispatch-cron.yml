name: Email Dispatch Cron

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  dispatch-email-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reconcile, flow runner, and dispatch worker
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL || 'https://tinglumgard.no' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is required for email dispatch cron."
            exit 1
          fi

          echo "Using APP_BASE_URL=${APP_BASE_URL}"

          RECONCILE_URL="${APP_BASE_URL%/}/api/cron/email-flow-reconcile"
          RECONCILE_RESPONSE_FILE=/tmp/email-flow-reconcile-response.json

          RECONCILE_HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$RECONCILE_RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${RECONCILE_URL}?token=${CRON_SECRET}")

          echo "Reconcile HTTP status: $RECONCILE_HTTP_CODE"
          echo "Reconcile response:"
          cat "$RECONCILE_RESPONSE_FILE"

          if [ "$RECONCILE_HTTP_CODE" -ge 400 ]; then
            if [ "$RECONCILE_HTTP_CODE" = "503" ] && grep -q "Email schema is not fully migrated" "$RECONCILE_RESPONSE_FILE"; then
              echo "::warning::Email reconcile skipped because schema is not fully migrated. Continuing."
            else
              echo "::error::Email flow reconcile endpoint failed with HTTP $RECONCILE_HTTP_CODE"
              exit 1
            fi
          fi

          FLOW_URL="${APP_BASE_URL%/}/api/cron/email-flow-runner"
          FLOW_RESPONSE_FILE=/tmp/email-flow-runner-response.json

          FLOW_HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$FLOW_RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${FLOW_URL}?token=${CRON_SECRET}")

          echo "Flow runner HTTP status: $FLOW_HTTP_CODE"
          echo "Flow runner response:"
          cat "$FLOW_RESPONSE_FILE"

          if [ "$FLOW_HTTP_CODE" -ge 400 ]; then
            if [ "$FLOW_HTTP_CODE" = "503" ] && grep -q "Email schema is not fully migrated" "$FLOW_RESPONSE_FILE"; then
              echo "::warning::Email flow runner skipped because flow schema is not fully migrated. Continuing to dispatch queue."
            else
              echo "::error::Email flow runner endpoint failed with HTTP $FLOW_HTTP_CODE"
              exit 1
            fi
          fi

          DISPATCH_URL="${APP_BASE_URL%/}/api/cron/email-dispatch"
          DISPATCH_RESPONSE_FILE=/tmp/email-dispatch-response.json

          DISPATCH_HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$DISPATCH_RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${DISPATCH_URL}?token=${CRON_SECRET}")

          echo "Dispatch HTTP status: $DISPATCH_HTTP_CODE"
          echo "Dispatch response:"
          cat "$DISPATCH_RESPONSE_FILE"

          if [ "$DISPATCH_HTTP_CODE" -ge 400 ]; then
            echo "::error::Email dispatch cron endpoint failed with HTTP $DISPATCH_HTTP_CODE"
            exit 1
          fi
