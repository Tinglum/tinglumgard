name: Egg Wishlist Proposal Cron

on:
  schedule:
    # Run around 08:00 Europe/Oslo on Mondays (covers DST shifts).
    - cron: "0 6,7 * * 1"
  workflow_dispatch:

jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger egg wishlist proposal job
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL || 'https://tinglumgard.no' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is required for egg wishlist proposal cron."
            exit 1
          fi

          URL="${APP_BASE_URL%/}/api/cron/egg-wishlist-proposal"
          RESPONSE_FILE=/tmp/egg-wishlist-proposal-response.json

          HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${URL}?token=${CRON_SECRET}")

          echo "HTTP status: $HTTP_CODE"
          echo "Cron response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Egg wishlist proposal endpoint failed with HTTP $HTTP_CODE"
            exit 1
          fi

