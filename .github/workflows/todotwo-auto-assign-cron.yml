name: TodoTwo Auto Assign Cron

# An hour after todotwo-generate-occurrences (04:00): the fourth day's tasks
# have to exist before anyone can be assigned to them. Running these the other
# way round would silently leave the far edge of the window empty, which is
# the exact thing this job is for.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger TodoTwo auto assign
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL || vars.CRON_BASE_URL || 'https://main--tinglum.netlify.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is required for TodoTwo auto assign cron."
            exit 1
          fi

          echo "Using CRON_BASE_URL=${CRON_BASE_URL}"

          URL="${CRON_BASE_URL%/}/api/cron/todotwo-auto-assign"
          RESPONSE_FILE=/tmp/todotwo-auto-assign-response.json

          HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${URL}")

          echo "HTTP status: $HTTP_CODE"
          echo "Cron response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::TodoTwo auto assign cron endpoint failed with HTTP $HTTP_CODE"
            exit 1
          fi
