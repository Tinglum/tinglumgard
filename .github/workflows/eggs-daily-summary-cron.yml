name: Eggs Daily Summary Cron

on:
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch:

jobs:
  send-eggs-daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger eggs daily summary
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL || vars.CRON_BASE_URL || 'https://main--tinglum.netlify.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is required for eggs daily summary cron."
            exit 1
          fi

          echo "Using CRON_BASE_URL=${CRON_BASE_URL}"

          URL="${CRON_BASE_URL%/}/api/cron/eggs-daily-summary"
          RESPONSE_FILE=/tmp/eggs-daily-summary-response.json

          HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${URL}?token=${CRON_SECRET}")

          echo "HTTP status: $HTTP_CODE"
          echo "Cron response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Eggs daily summary endpoint failed with HTTP $HTTP_CODE"
            exit 1
          fi
