name: TodoTwo Daily Digest Cron

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger TodoTwo daily digest
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL || vars.CRON_BASE_URL || 'https://main--tinglum.netlify.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is required for TodoTwo daily digest cron."
            exit 1
          fi

          echo "Using CRON_BASE_URL=${CRON_BASE_URL}"

          URL="${CRON_BASE_URL%/}/api/cron/todotwo-daily-digest"
          RESPONSE_FILE=/tmp/todotwo-daily-digest-response.json

          HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${URL}")

          echo "HTTP status: $HTTP_CODE"
          echo "Cron response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::TodoTwo daily digest cron endpoint failed with HTTP $HTTP_CODE"
            exit 1
          fi
