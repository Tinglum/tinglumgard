name: Eggs Forecast Sync Cron

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  sync-egg-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger eggs forecast sync
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL || 'https://main--tinglum.netlify.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is required for eggs forecast sync cron."
            exit 1
          fi

          echo "Using APP_BASE_URL=${APP_BASE_URL}"

          URL="${APP_BASE_URL%/}/api/cron/eggs-forecast-sync"
          RESPONSE_FILE=/tmp/eggs-forecast-sync-response.json

          HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${URL}?token=${CRON_SECRET}")

          echo "HTTP status: $HTTP_CODE"
          echo "Cron response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Egg forecast sync endpoint failed with HTTP $HTTP_CODE"
            exit 1
          fi
