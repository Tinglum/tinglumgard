name: Pig Order Lifecycle Cron

on:
  # Scheduled execution moved to Cloudflare Worker (cloudflare/cron-worker / tinglumgard-crons)

  # schedule:

  # - cron: "30 8 * * *"   # 08:30 UTC (09:30 CET) daily
  workflow_dispatch:

jobs:
  pig-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger pig lifecycle emails (Day +3 referral nudge & pre-slaughter explainer)
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL || vars.CRON_BASE_URL || 'https://main--tinglum.netlify.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is required for pig lifecycle cron."
            exit 1
          fi

          URL="${CRON_BASE_URL%/}/api/cron/pig-lifecycle"
          RESPONSE_FILE=/tmp/pig-lifecycle-response.json

          HTTP_CODE=$(curl --silent --show-error \
            --request GET \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${URL}?token=${CRON_SECRET}")

          echo "HTTP status: $HTTP_CODE"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Pig lifecycle cron failed with HTTP $HTTP_CODE"
            exit 1
          fi
