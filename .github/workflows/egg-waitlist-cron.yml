name: Egg Waitlist Cron

on:
  schedule:
    # GitHub Actions minimum interval is 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-waitlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "Missing required secret: APP_BASE_URL"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required secret: CRON_SECRET"
            exit 1
          fi

      - name: Trigger egg waitlist processor
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: $CRON_SECRET" \
            "${APP_BASE_URL%/}/api/cron/egg-waitlist" \
            | tee /tmp/egg-waitlist-response.json

          echo "Cron response:"
          cat /tmp/egg-waitlist-response.json
