name: Egg Waitlist Cron

on:
  schedule:
    # GitHub Actions minimum interval is 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-waitlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger egg waitlist processor
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL || 'https://tinglumgard.no' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is required for egg waitlist cron."
            exit 1
          fi

          echo "Using APP_BASE_URL=${APP_BASE_URL}"

          URL="${APP_BASE_URL%/}/api/cron/egg-waitlist"
          RESPONSE_FILE=/tmp/egg-waitlist-response.json

          HTTP_CODE=$(curl --silent --show-error \
            --request POST \
            -H "x-cron-secret: $CRON_SECRET" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "${URL}?token=${CRON_SECRET}")

          echo "HTTP status: $HTTP_CODE"
          echo "Cron response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Egg waitlist cron endpoint failed with HTTP $HTTP_CODE"
            exit 1
          fi
