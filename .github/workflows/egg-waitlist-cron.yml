name: Egg Waitlist Cron

on:
  schedule:
    # GitHub Actions minimum interval is 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-waitlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger egg waitlist processor
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL || 'https://tinglumgard.no' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          set -euo pipefail

          URL="${APP_BASE_URL%/}/api/cron/egg-waitlist"
          RESPONSE_FILE=/tmp/egg-waitlist-response.json

          if [ -n "${CRON_SECRET:-}" ]; then
            HTTP_CODE=$(curl --silent --show-error \
              -H "x-cron-secret: $CRON_SECRET" \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              "${URL}?token=${CRON_SECRET}")
          else
            echo "CRON_SECRET not set in GitHub; calling endpoint without auth header."
            HTTP_CODE=$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              "$URL")
          fi

          echo "HTTP status: $HTTP_CODE"
          echo "Cron response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Egg waitlist cron endpoint failed with HTTP $HTTP_CODE"
            exit 1
          fi
